[package]
name = "xamcard"
version = "1.0.0"
description = "XamCard - Mass Exam Card Generator"
authors = ["XamCard"]
edition = "2021"

[lib]
name = "xamcard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "xamcard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
